<!doctype html>
<!-- Cloudflare Pages answers any path it has no file for with this page and
     status 404 (a top-level 404.html turns off its fallback to index.html).
     Static and self-contained: no bundle, no map. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Not found · Xue</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f3efe6;
        --ink: #1c1b18;
        --muted: #6b665c;
        --rule: #d8d1c2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #000;
          --ink: #ece8df;
          --muted: #9a958b;
          --rule: #2b2925;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.25rem;
        color: var(--muted);
      }
      ul {
        list-style: none;
        padding: 1rem 0 0;
        margin: 1rem 0 0;
        border-top: 1px solid var(--rule);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 · Page not found</h1>
      <p>There is nothing at this address.</p>
      <p lang="zh-CN">找不到这个页面。</p>
      <p lang="ja">このページは見つかりません。</p>
      <ul>
        <li><a href="/">Live weather maps</a></li>
        <li><a href="/showcase">Historical cases</a></li>
        <li><a href="/tc/">Tropical cyclones</a></li>
        <li><a href="/typhoon">Storm map</a></li>
      </ul>
    </main>
  </body>
</html>
