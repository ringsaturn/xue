<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3EFE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" data-i18n-content="wbMetaDescription" content="A forecast read in depth along a line or at a point: the vertical section, the sounding and the hours ahead on one pressure axis." />
    <title>Workbench · Xue</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Search metadata; the build writes a copy per language with its own
         canonical and hreflang set (web/tooling/sitepages.ts), and
         pagemeta.ts keeps them true, as on the viewer. The
         place in the query is state, not content: every place is one page. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://xue.ringsaturn.me/workbench" />
    <link rel="alternate" hreflang="x-default" href="https://xue.ringsaturn.me/workbench" />
    <link rel="alternate" hreflang="en" href="https://xue.ringsaturn.me/workbench" />
    <link rel="alternate" hreflang="zh-CN" href="https://xue.ringsaturn.me/zh/workbench" />
    <link rel="alternate" hreflang="zh-TW" href="https://xue.ringsaturn.me/zh-hant/workbench" />
    <link rel="preconnect" href="https://dataset.ringsaturn.me" crossorigin />

    <!-- Settled before the first paint; see the note in index.html. -->
    <script>
      (function () {
        try {
          var url = new URLSearchParams(location.search).get("theme");
          var stored = localStorage.getItem("xue-theme");
          var choice = url === "dark" || url === "light" ? url : stored === "dark" || stored === "light" ? stored : null;
          if (choice) document.documentElement.dataset.theme = choice;
        } catch (error) {
          // Storage can be unavailable (privacy modes); prefers-color-scheme decides.
        }
      })();
    </script>

    <!-- Social cards are scraped from the static markup, before the i18n
         pass runs, so they stay in English like the pre-JS fallback copy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xue" />
    <meta property="og:url" content="https://xue.ringsaturn.me/workbench" />
    <meta property="og:title" content="Workbench · Xue" />
    <meta property="og:description" content="A forecast read in depth along a line or at a point: the vertical section, the sounding and the hours ahead on one pressure axis." />
    <meta property="og:image" content="https://xue.ringsaturn.me/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Workbench · Xue" />
    <meta name="twitter:description" content="A forecast read in depth along a line or at a point: the vertical section, the sounding and the hours ahead on one pressure axis." />
    <meta name="twitter:image" content="https://xue.ringsaturn.me/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "@id": "https://xue.ringsaturn.me/workbench",
        "url": "https://xue.ringsaturn.me/workbench",
        "name": "Workbench · Xue",
        "description": "A forecast read in depth along a line or at a point: the vertical section, the sounding and the hours ahead on one pressure axis.",
        "isPartOf": { "@type": "WebSite", "@id": "https://xue.ringsaturn.me/#website", "url": "https://xue.ringsaturn.me/", "name": "Xue" }
      }
    </script>
  </head>
  <body class="workbench-page">
    <main class="wb" id="workbench">
      <header class="wb-header">
        <h1 data-i18n="wbTitle">Workbench</h1>
        <span class="wb-model" id="wb-model"></span>
        <span class="wb-run" id="wb-run"></span>
        <p class="wb-notice" id="wb-notice" role="status"></p>
        <button class="section-chip" id="wb-action" type="button" hidden></button>
        <button class="section-chip" id="wb-copy" type="button" data-i18n="wbCopyLink">Copy link</button>
        <a class="section-chip" id="wb-open-map" href="/gfs" data-i18n="wbOpenMap">Show on the map</a>
        <button id="settings-toggle" class="icon-button" type="button" aria-haspopup="dialog" aria-expanded="false" data-i18n-aria="settingsAria" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>
    </main>

    <!-- The settings sheet, the viewer's: theme, language, units, grids and
         coordinates; rows written by settingssheet.ts. -->
    <div id="settings-sheet" class="model-sheet settings-sheet" hidden>
      <div class="model-sheet-scrim" data-sheet-dismiss></div>
      <div class="model-sheet-panel settings-panel" role="dialog" aria-modal="true" data-i18n-aria="settingsAria" aria-label="Settings">
        <span class="sheet-grip" aria-hidden="true"></span>
        <p class="sheet-heading" data-i18n="settingsHeading">Settings</p>
        <div id="settings-body" class="settings-body">
          <div class="export-field settings-field">
            <span class="export-caption" id="settings-language-caption" data-i18n="settingsLanguage">Language</span>
            <div id="settings-languages" class="settings-languages" role="group" aria-labelledby="settings-language-caption"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/workbench.ts"></script>
  </body>
</html>
