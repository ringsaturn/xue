name: publish cma

# The CMA weather radar level-3 mosaic (RADAR_L3_MST_CREF): the China
# Meteorological Administration's national composite reflectivity, a mosaic
# every six minutes, published on its data portal as BIN tiles. A private
# sync job decodes the zoom-5 tiles and keeps them as one plain Zarr v3
# store per UTC day in an archive of its own, every twenty minutes; the
# live feed
# here is a rolling window read back out of that archive — the last two
# whole hours plus the hour in progress, on the portal's 0.0439° tile grid,
# the native six-minute step — rebuilt every five minutes into a round
# subdirectory of its run (<model>.<run>/<HHMM>/) and pointed at by
# latest-cma.json. Like publish-jma.yml, one round per job on a
# five-minute cron: a round that finds nothing new (the archive moves in
# twenty-minute steps) is a minute of runner time, and a round with new
# slots reads a few megabytes of the day's shard and converts thirty
# frames. The archive is read in process (xuebuild/cmaarchive.py, the
# `cma` dependency group: zarr-python over s3fs, xarray for the series
# the converter reads), so nothing beyond this repository is installed.
# Everything about the archive is a repository secret: XUE_CMA_ARCHIVE is
# its s3:// prefix, read with R2_ACCOUNT_ID / R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY (the dataset bucket's token when it can read the
# archive too, else the CMA_ARCHIVE_* pair). None has a default in code.
#
# Machine time: twelve jobs an hour of one to three minutes each, roughly
# 300 hours a month, free on a public repository's standard runners.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Keep running rounds until twenty past the next hour instead of one round"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds when looping"
        type: string
        default: "2"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress)"
        type: string
        default: "3"
      encoder:
        description: "auto (the xuepy wheel when its release knows the cma source, else the reference pipeline with GDAL), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the bucket's newest frame"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/successor_queued.sh lists this workflow's waiting runs, for a
  # looping dispatch to yield to the next scheduled job.
  actions: read

concurrency:
  group: publish-cma
  # A late cron queues behind the job still running and then finds
  # nothing new; a looping dispatch yields to it on its own.
  cancel-in-progress: false

env:
  # Which encoder the rounds convert through. The other publish-* workflows
  # pin XUE_ENCODER=native so a fall back to the reference pipeline fails
  # instead of passing unnoticed; here the wheel on PyPI may predate the
  # source (a scheduled run cannot pass an input, and a wheel is released
  # on the crate's tags, not with every source), so `auto` resolves the
  # choice in the job below — native when the installed wheel knows the
  # model, else the reference pipeline with a ::warning:: on the run — and
  # the dispatch can still insist on either.
  ENCODER: ${{ inputs.encoder || 'auto' }}
  # Every round is published as Zarr stores alone (plan 017 phase 7): the
  # store is derived from the `.xue` the round wrote and the file retired
  # before upload. A round's export is a fraction of its build.
  XUE_ZARR: "1"
  XUE_CONTAINER: "0"

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    runs-on: ubuntu-24.04
    # One round is a few minutes; a round that has to decode a window's
    # worth of frames after an outage takes up to half an hour. A looping
    # dispatch stops at twenty past the next hour on its own (UNTIL_MINUTE
    # below); this is the backstop for a round that hangs.
    timeout-minutes: 90
    env:
      MODEL: cma
      FRAME_CACHE: "false"
      ONCE: ${{ !inputs.loop }}
      ROUND_MINUTES: ${{ inputs.round_minutes || '2' }}
      # For a looping dispatch: run past the hour, and hand over to the next
      # scheduled job as soon as it is waiting.
      UNTIL_MINUTE: "80"
      HANDOVER_CHECK: scripts/successor_queued.sh
      # No edge-cache warm-up: a round is a handful of small objects
      # replaced a few minutes later, and the shell's next poll fills the
      # edge itself.
      WARM: "false"
      HOURS: ${{ inputs.hours || '3' }}
      PROFILE: ${{ inputs.profile || 'balanced' }}
      KEEP: ${{ inputs.keep || '2' }}
      FORCE: ${{ inputs.force || false }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          printf '%s' "$ROUND_MINUTES" | grep -Eq '^[1-9][0-9]?$' \
            || { echo "::error::round_minutes must be a positive integer of minutes"; exit 1; }
          printf '%s' "$HOURS" | grep -Eq '^[1-9][0-9]?$' \
            || { echo "::error::hours must be a positive integer"; exit 1; }
          printf '%s' "$KEEP" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::keep must be a positive integer"; exit 1; }

      # The AWS CLI is preinstalled on the runner; R2 is its S3 endpoint.
      # The credentials are step-scoped rather than job env, so third-party
      # actions never see them; the listings prove they work before the
      # first round rather than at its fetch or its upload. Two buckets:
      # the dataset bucket the rounds publish into, and the archive bucket
      # the archive reader takes the window from.
      - name: Check R2 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARCHIVE_ACCESS_KEY_ID: ${{ secrets.CMA_ARCHIVE_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.CMA_ARCHIVE_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          XUE_CMA_ARCHIVE: ${{ secrets.XUE_CMA_ARCHIVE }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY XUE_CMA_ARCHIVE; do
            [ -n "${!name}" ] || { echo "::error::$name is empty; set the repository secrets"; exit 1; }
          done
          aws --version
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 ls "s3://dataset/xue/" --region auto --endpoint-url "$endpoint" > /dev/null \
            || { echo "::error::R2 credentials failed a test listing of the dataset bucket"; exit 1; }
          AWS_ACCESS_KEY_ID="$ARCHIVE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$ARCHIVE_SECRET_ACCESS_KEY" \
            aws s3 ls "${XUE_CMA_ARCHIVE}/" --region auto --endpoint-url "$endpoint" > /dev/null \
            || { echo "::error::the archive credentials failed a test listing of the CMA archive; set CMA_ARCHIVE_ACCESS_KEY_ID / CMA_ARCHIVE_SECRET_ACCESS_KEY to a token that reads it"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      # No ffmpeg: the source ships no video. The xuepy wheel carries the
      # GDAL the native encoder extracts and inspects with; the reference
      # pipeline needs the system one. The `cma` group is what reads the
      # archive: zarr-python, s3fs, xarray and netCDF4.
      - name: Sync Python environment
        run: uv sync --group cma

      # XUE_ENCODER is what xuebuild reads (auto | native | python); it is
      # set here rather than at the workflow level so a wheel that predates
      # the source resolves to the reference pipeline explicitly, once, and
      # every later step (the GDAL install, the rounds) sees one answer.
      # `auto` on the xuebuild side would take the wheel whenever it imports
      # and only fail inside the round, as the scheduled runs did.
      - name: Resolve the encoder
        run: |
          set -euo pipefail
          case "$ENCODER" in
            native|python) encoder="$ENCODER" ;;
            auto)
              if .venv/bin/python -c "import sys; from xuebuild import native; sys.exit(0 if native.knows_source('$MODEL') else 1)"; then
                encoder=native
              else
                wheel=$(.venv/bin/python -c "from xuebuild import native; print(native.version() or 'unknown')")
                echo "::warning::xuepy ${wheel} does not know the ${MODEL} source; converting through the reference pipeline (slower). Release a wheel that carries it and bump the pin in pyproject.toml."
                encoder=python
              fi ;;
            *) echo "::error::encoder must be auto, native or python, not '$ENCODER'"; exit 1 ;;
          esac
          echo "XUE_ENCODER=$encoder" >> "$GITHUB_ENV"
          echo "encoder: $encoder" >> "$GITHUB_STEP_SUMMARY"

      - name: Install GDAL for the reference pipeline
        if: ${{ env.XUE_ENCODER == 'python' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          gdalinfo --version

      - name: Run the rounds
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # What the archive reader opens the bucket with.
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.CMA_ARCHIVE_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CMA_ARCHIVE_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          XUE_CMA_ARCHIVE: ${{ secrets.XUE_CMA_ARCHIVE }}
        run: |
          set -o pipefail
          scripts/window_rounds.sh 2>&1 | tee rounds.log
          status=$?
          {
            echo "### cma rounds"
            echo
            echo '```'
            grep -E '^round [0-9]{4}:|rounds this hour' rounds.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The pointer is served with no-cache, so the edge revalidates it; a
      # stale read here means the last flip has not propagated rather than
      # failed, so it warns instead of failing an otherwise complete hour.
      - name: Verify the live pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          [ -f web/public/data/latest-cma.json ] || { echo "No round built this hour." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          url="https://dataset.ringsaturn.me/xue/latest-cma.json"
          published=$(curl -fsSL "$url" | jq -r '.manifestPath' || true)
          if [ -n "$published" ] && [ -f "web/public/data/$published" ]; then
            echo "$url serves $published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$url serves '${published:-nothing}', not the round this job last built"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: publish-report-cma
          path: |
            rounds.log
            build-report.json
            web/public/data/latest-cma.json
          retention-days: 14
          if-no-files-found: ignore
