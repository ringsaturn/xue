name: publish run

# Reusable publishing pipeline, one call per source. Callers
# (publish-gfs.yml, publish-sflux.yml, publish-ecmwf.yml, publish-hrrr.yml)
# own the schedule
# and the manual dispatch; this file owns the work, fanned out over three
# jobs:
#
#   resolve   the newest complete cycle -> skip if R2 already serves it with
#             every bundle the source publishes today, *top up* if it serves
#             it short of some (a variable that landed between cycles) ->
#             split the bundles to build into groups (`xuebuild bundle-groups`)
#   build     one job per group, in parallel: fetch only that group's GRIB
#             records -> pack its .xue bundles -> upload them to the run
#             directory on R2 and warm them at the edge -> hand the partial
#             manifest on as a workflow artifact
#   finalize  merge the parts into the run's manifest (`xuebuild
#             assemble-run`; onto the live manifest for a top-up) -> upload
#             and warm it -> flip the live pointer -> delete the runs it
#             superseded
#
# A run's bundles do not depend on one another (tests/test_assemble.py holds
# a split build byte-identical to a whole one), so the wall time is one
# group's build rather than every bundle's in a row: the bundle count grows,
# the publish does not. Nothing is live until the pointer flips in the last
# job; a group that fails leaves unreferenced objects the next successful
# publish prunes.
#
# The bucket is managed over R2's S3 API with the AWS CLI (`make
# upload-r2-bundles`, `make upload-r2-manifest`, `make prune-r2`), so the
# credentials are an R2 API token's key pair — R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY repository secrets, with CLOUDFLARE_ACCOUNT_ID naming
# the endpoint host. The static Pages shell is not touched here — it only
# needs redeploying (`make deploy`) when frontend code changes.

on:
  workflow_call:
    inputs:
      model:
        description: "Forecast source: gfs, sflux, ecmwf or hrrr"
        required: true
        type: string
      run:
        description: "Cycle to publish: latest or YYYYMMDDHH"
        type: string
        default: latest
      profile:
        description: "Quantization/compression profile"
        type: string
        default: balanced
      keep:
        description: >-
          Published runs of this source to keep on R2. One, the default,
          leaves only the run that just went live: the bucket carries no
          history.
        type: string
        default: "1"
      force:
        description: "Rebuild even when R2 already serves this run"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what pruning would delete, but write nothing to R2"
        type: boolean
        default: false
      max_jobs:
        description: >-
          Most build jobs to split the run into. A free GitHub plan runs 20
          jobs at once across the whole account; the default leaves room
          for a test run or another source's publish beside this one. A
          source whose upstream throttles bursts takes fewer.
        type: number
        default: 16
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

env:
  # Convert through the native encoder (the xuepy wheel, a dependency of
  # xuebuild). Insisting rather than letting it fall back: a run that
  # quietly took the subprocess pipeline would take far longer and look
  # identical in the logs.
  XUE_ENCODER: native

jobs:
  resolve:
    name: resolve ${{ inputs.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run: ${{ steps.target.outputs.run }}
      skip: ${{ steps.target.outputs.skip }}
      topup: ${{ steps.target.outputs.topup }}
      groups: ${{ steps.groups.outputs.groups }}
    env:
      MODEL: ${{ inputs.model }}
      RUN_INPUT: ${{ inputs.run }}
      PROFILE: ${{ inputs.profile }}
      KEEP: ${{ inputs.keep }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
      MAX_JOBS: ${{ inputs.max_jobs }}
    steps:
      - uses: actions/checkout@v4

      # The AWS CLI is preinstalled on the runner; R2 is its S3 endpoint.
      # The credentials are deliberately step-scoped (here and on the make
      # steps that talk to R2) rather than job env, so third-party actions
      # never see them. The listing proves they actually work before the
      # build starts, instead of failing at the upload step.
      - name: Check R2 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty; set the R2 repository secrets"; exit 1; }
          done
          aws --version
          aws s3 ls "s3://dataset/xue/" --region auto \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" > /dev/null \
            || { echo "::error::R2 credentials failed a test listing of the dataset bucket"; exit 1; }

      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$MODEL" in
            gfs|sflux|ecmwf|hrrr) ;;
            *) echo "::error::unknown source: $MODEL"; exit 1 ;;
          esac
          case "$PROFILE" in
            balanced|quality|compact) ;;
            *) echo "::error::unknown profile: $PROFILE"; exit 1 ;;
          esac
          printf '%s' "$RUN_INPUT" | grep -Eq '^(latest|[0-9]{10})$' \
            || { echo "::error::run must be latest or YYYYMMDDHH"; exit 1; }
          printf '%s' "$KEEP" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::keep must be a positive integer"; exit 1; }
          printf '%s' "$MAX_JOBS" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::max_jobs must be a positive integer"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      # When R2 already serves the newest available cycle — the schedule
      # fires on a fixed clock, but a source can be late or a cycle can be
      # published twice — there is nothing to do unless the source has
      # started publishing bundles that run does not carry: then the run is
      # *topped up*, only those bundles built and merged onto the manifest
      # the bucket holds (saved here as the finalize job's base). A dry run
      # never skips and never tops up: its whole point is to exercise the
      # whole pipeline and preview the writes. `force` rebuilds everything.
      - name: Resolve the run to publish
        id: target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # The whole axis the source publishes (240 hours for the global
          # models, 18 for HRRR) — the same default `build-bin` and
          # `assemble-run` take below when given no --hours.
          run=$(uv run python -c "from xuebuild.fetch import resolve_run; from xuebuild.sources import source_spec; print(resolve_run('${RUN_INPUT}', hours=source_spec('${MODEL}').horizon_hours, model='${MODEL}').id)")
          live=$(make -s live-run MODEL="$MODEL" || true)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "$live" ] && [ "$FORCE" != "true" ] && [ -z "$DRY_RUN" ]; then
            make -s live-manifest MODEL="$MODEL" > live-manifest.json
            missing=$(uv run python -m xuebuild bundle-groups --model "$MODEL" --max-jobs "$MAX_JOBS" \
              --base-manifest live-manifest.json | jq -r '[.[].group] | join(" ")')
            if [ -z "$missing" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "topup=false" >> "$GITHUB_OUTPUT"
              echo "R2 already serves $MODEL run $run with every published bundle, nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "topup=true" >> "$GITHUB_OUTPUT"
              echo "Topping up $MODEL run $run, which R2 serves without: $missing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "topup=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $MODEL run $run (live: ${live:-none})." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The live manifest travels to the finalize job as it was read here,
      # so the top-up merges onto exactly the run the missing set was
      # computed against.
      - uses: actions/upload-artifact@v4
        if: ${{ steps.target.outputs.topup == 'true' }}
        with:
          name: base-${{ inputs.model }}
          path: live-manifest.json
          retention-days: 3
          if-no-files-found: error

      # The build matrix: which bundles each job packs, whether it needs
      # ffmpeg for an H.264 companion, and the slug its files go by — every
      # published bundle, or for a top-up only the ones the live run lacks.
      # Computed even for a skipped publish so the matrix expression below
      # always has JSON to parse.
      - name: Split the run into build jobs
        id: groups
        env:
          TOPUP: ${{ steps.target.outputs.topup }}
        run: |
          set -euo pipefail
          base=""
          [ "$TOPUP" != "true" ] || base="--base-manifest live-manifest.json"
          # shellcheck disable=SC2086 # the base flag is deliberately unquoted
          groups=$(uv run python -m xuebuild bundle-groups --model "$MODEL" --max-jobs "$MAX_JOBS" $base)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          {
            echo "### $MODEL build jobs"
            echo
            printf '%s' "$groups" | jq -r '.[] | "- `\(.group)`" + (if .video then " (video)" else "" end) + (if .eccodes then " (eccodes)" else "" end)'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ inputs.model }} ${{ matrix.group }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.groups) }}
    env:
      MODEL: ${{ inputs.model }}
      RUN: ${{ needs.resolve.outputs.run }}
      PROFILE: ${{ inputs.profile }}
      GROUP: ${{ matrix.group }}
      SLUG: ${{ matrix.slug }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 3.14 compresses planes in-process through the stdlib zstd module;
          # older interpreters shell out per plane and build far slower.
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      # No GDAL. This job converts through the native encoder (XUE_ENCODER is
      # pinned to `native` above) and the xuepy wheel carries its own — for
      # extraction, and through `xue.gdal_info` for the inspection pass that
      # used to shell out to `gdalinfo`. The dependency pin requires a wheel
      # carrying it (`xuepy>=0.13.1`), so `uv sync` above fails rather than
      # letting a build reach a `gdalinfo` that is not here. The floor is
      # also what keeps a wheel whose decoder predates container v2 out of
      # this job: the build reads every bundle back through it.
      #
      # ffmpeg encodes the H.264 companions, which stay on the Python side,
      # and only the groups carrying a surface field with a companion need
      # it: the encoder skips the companion with a warning when ffmpeg is
      # missing, which is why the matrix says rather than the job guessing.
      # ECMWF open data is CCSDS packed; xue repacks it with eccodes at fetch
      # time because GDAL builds usually lack libaec, so every ECMWF job
      # installs the tools — and so would any job whose group reads a
      # companion family marked for the same repack (the matrix's
      # `eccodes`; none is now that the wheel's GDAL reads the JPEG
      # 2000-packed GFS-Wave file as published). zstd is only reached below
      # Python 3.14.
      - name: Install ffmpeg / eccodes
        if: ${{ matrix.video || matrix.eccodes || inputs.model == 'ecmwf' }}
        env:
          VIDEO: ${{ matrix.video }}
          ECCODES: ${{ matrix.eccodes }}
        run: |
          set -euo pipefail
          packages=""
          [ "$VIDEO" != "true" ] || packages="$packages ffmpeg"
          [ "$MODEL" != "ecmwf" ] && [ "$ECCODES" != "true" ] || packages="$packages libeccodes-tools"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $packages

      # Only this group's GRIB records come down, and only its bundles are
      # packed; the manifest written is a part (manifest.part.<slug>.json)
      # for the finalize job to merge.
      - name: Build ${{ matrix.group }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the group is a space-separated list
          uv run python -m xuebuild -v build-bin \
            --model "$MODEL" --run "$RUN" --profile "$PROFILE" \
            --bundles $GROUP \
            > "build-report-$SLUG.json"
          {
            echo "### $MODEL $RUN: $GROUP"
            echo
            echo '```json'
            jq '{bundles: [.bundles[] | {variable, byteLength, crc32}]}' "build-report-$SLUG.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `aws s3 sync` of what this job built into the run directory
      # (immutable, ?v=<crc32>-addressed, unreferenced until the pointer
      # flips), then one pass over those objects through the CDN so the
      # edge holds them before anyone asks (scripts/warm_edge_cache.sh).
      - name: Upload the bundles to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make upload-r2-bundles MODEL="$MODEL" RUN="$RUN" DRY_RUN="$DRY_RUN"

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ inputs.model }}-${{ matrix.slug }}
          path: web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/manifest.part.*.json
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-report-${{ inputs.model }}-${{ matrix.slug }}
          path: build-report-${{ matrix.slug }}.json
          retention-days: 14
          if-no-files-found: ignore

  finalize:
    name: finalize ${{ inputs.model }}
    needs: [resolve, build]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model }}
      RUN: ${{ needs.resolve.outputs.run }}
      KEEP: ${{ inputs.keep }}
      TOPUP: ${{ needs.resolve.outputs.topup }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ inputs.model }}-*
          merge-multiple: true
          path: web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.topup == 'true' }}
        with:
          name: base-${{ inputs.model }}

      # The parts merge into the run's manifest in publication order, every
      # published bundle present exactly once, and the pointer is written
      # with the finished manifest's CRC32. For a top-up they merge onto the
      # live manifest the resolve job saved, so the result is the manifest a
      # whole build would have written today. Nothing is on this runner but
      # the parts: the bundles are already in the bucket.
      - name: Assemble the manifest
        run: |
          set -euo pipefail
          base=""
          [ "$TOPUP" != "true" ] || base="--base-manifest live-manifest.json"
          # shellcheck disable=SC2086 # the base flag is deliberately unquoted
          uv run python -m xuebuild -v assemble-run \
            --model "$MODEL" --run "$RUN" $base > assemble-report.json
          {
            echo "### $MODEL $RUN"
            echo
            echo '```json'
            jq '{model, run, byteLength, bundles, built, dropped}' assemble-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The manifest goes up immutable like the bundles it names and is
      # warmed on its own; then the mutable per-model live pointer, which
      # takes the run live.
      - name: Upload the manifest and take the run live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make upload-r2-manifest MODEL="$MODEL" RUN="$RUN" DRY_RUN="$DRY_RUN"

      - name: Delete superseded runs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make prune-r2 MODEL="$MODEL" KEEP="$KEEP" DRY_RUN="$DRY_RUN"

      # The pointer is served with no-cache, so the edge revalidates it; a
      # mismatch here means the flip has not propagated rather than failed,
      # so it warns instead of failing an otherwise complete publish.
      - name: Verify the live pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          latest="latest.json"
          [ "$MODEL" = "gfs" ] || latest="latest-${MODEL}.json"
          url="https://dataset.ringsaturn.me/xue/${latest}"
          published=$(curl -fsSL "$url" | jq -r '.run' || true)
          if [ "$published" = "$RUN" ]; then
            echo "$url serves run $published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$url serves '${published:-nothing}', expected $RUN"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: publish-report-${{ inputs.model }}
          path: |
            assemble-report.json
            web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/manifest.json
            web/public/data/latest*.json
          retention-days: 14
          if-no-files-found: ignore
