name: publish run

# Reusable publishing pipeline, one call per source. Callers
# (publish-gfs.yml, publish-sflux.yml, publish-ecmwf.yml, publish-ifs.yml, publish-aifs.yml,
# publish-ifshres.yml, publish-hrrr.yml, publish-rrfs.yml, publish-woofnam.yml, publish-gefsaero.yml, publish-cmadust.yml,
# publish-silam.yml, publish-cfs.yml, publish-iconeu.yml, publish-arpege.yml, publish-cmageps.yml) own the schedule
# and the manual dispatch; this file owns the work, fanned out over five
# jobs:
#
#   resolve   the newest complete cycle -> skip if R2 already serves it with
#             every bundle the source publishes today, *top up* if it serves
#             it short of some (a variable that landed between cycles) ->
#             split the bundles to build into groups (`xuebuild bundle-groups`)
#   build     one job per group, in parallel: fetch only that group's GRIB
#             records -> write its bundles' arrays into the run's shared Zarr
#             stores (bundles.zarr, bundles.half.zarr) -> upload them to the
#             run directory on R2 and warm its posters and series stores at
#             the edge -> hand the
#             partial manifest and the stores' partial group documents
#             (zarr.part.*.json) on as a workflow artifact
#   columns   only for a source in `sources.COLUMN_STORE_SOURCES`, between
#             build and finalize, and for a run R2 does not serve yet (a
#             top-up or forced rebuild of the live run is not cut before the
#             flip): assemble the parts locally, cut the run's
#             column store from the shards on R2 (docs/zarr-profile.md),
#             upload and warm it, and hand finalize its descriptor
#             (`columns.json`) as an artifact. No manifest, Item or pointer
#             is written here. A source with a store therefore goes live
#             when the store is ready; without it when the cut fails or
#             takes more than 30 minutes. A run R2 already serves but lacks
#             its store takes the other road: attached after the fact with a
#             second manifest and pointer write (`make publish-columns`)
#   finalize  merge the parts into the run's manifest and the stores' group
#             documents (`xuebuild assemble-run`; onto the live manifest and
#             the live group documents for a top-up), and derive
#             the run's STAC Item, the source's Collection and the root
#             catalog from it (docs/stac.md) -> upload the group documents,
#             then the manifest, and warm both with the shared stores' arrays
#             (their ?v= exists only now),
#             the Item beside it -> flip the live pointer, the Collection and
#             catalog with it (`assemble-run --columns` names the store
#             when the columns job left a descriptor)
#   prune     after finalize succeeded and the shells' poll interval: delete
#             the runs it superseded
#
# A run's bundles do not depend on one another (tests/test_assemble.py holds
# a split build byte-identical to a whole one), so the wall time is one
# group's build rather than every bundle's in a row: the bundle count grows,
# the publish does not. Nothing is live until the pointer flips in the last
# job; a group that fails leaves unreferenced objects the next successful
# publish prunes.
#
# The bucket is managed over R2's S3 API with the AWS CLI (`make
# upload-r2-bundles`, `make upload-r2-manifest`, `make prune-r2`), so the
# credentials are an R2 API token's key pair — R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY repository secrets, with CLOUDFLARE_ACCOUNT_ID naming
# the endpoint host. The static Pages shell is not touched here — it only
# needs redeploying (`make deploy`) when frontend code changes.

on:
  workflow_call:
    inputs:
      model:
        description: "Forecast source: gfs, sflux, ecmwf, ifs, aifs, ifshres, hrrr, rrfs, woofnam, gefsaero, cmadust, silam, cfs, iconeu, arpege or cmageps"
        required: true
        type: string
      run:
        description: "Cycle to publish: latest or YYYYMMDDHH"
        type: string
        default: latest
      profile:
        description: "Quantization/compression profile"
        type: string
        default: balanced
      keep:
        description: >-
          Published runs of this source to keep on R2. One, the default,
          leaves only the run that just went live: the bucket carries no
          history.
        type: string
        default: "1"
      force:
        description: "Rebuild even when R2 already serves this run"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what pruning would delete, but write nothing to R2"
        type: boolean
        default: false
      max_jobs:
        description: >-
          Most build jobs to split the run into. A free GitHub plan runs 20
          jobs at once across the whole account; the default leaves room
          for a test run or another source's publish beside this one. A
          source whose upstream throttles bursts takes fewer.
        type: number
        default: 16
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

env:
  # Convert through the native encoder (the xuepy wheel, a dependency of
  # xuebuild). Insisting rather than letting it fall back: a run that
  # quietly took the subprocess pipeline would take far longer and look
  # identical in the logs.
  XUE_ENCODER: native

jobs:
  resolve:
    name: resolve ${{ inputs.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run: ${{ steps.target.outputs.run }}
      skip: ${{ steps.target.outputs.skip }}
      topup: ${{ steps.target.outputs.topup }}
      groups: ${{ steps.groups.outputs.groups }}
      columns: ${{ steps.columns.outputs.columns }}
      # The live pointer as "run:manifest CRC32", empty when there is none:
      # what a later job may find on R2 before it writes.
      live: ${{ steps.target.outputs.live }}
      # Whether R2 serves some other run than this one (or none): only then
      # does the columns job cut before the flip.
      fresh: ${{ steps.target.outputs.fresh }}
    env:
      MODEL: ${{ inputs.model }}
      RUN_INPUT: ${{ inputs.run }}
      PROFILE: ${{ inputs.profile }}
      KEEP: ${{ inputs.keep }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
      MAX_JOBS: ${{ inputs.max_jobs }}
    steps:
      - uses: actions/checkout@v4

      # The AWS CLI is preinstalled on the runner; R2 is its S3 endpoint.
      # The credentials are deliberately step-scoped (here and on the make
      # steps that talk to R2) rather than job env, so third-party actions
      # never see them. The read proves they actually work before the
      # build starts, instead of failing at the upload step.
      - name: Check R2 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty; set the R2 repository secrets"; exit 1; }
          done
          aws --version
          aws s3api head-object --bucket dataset --key xue/catalog.json --region auto \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" > /dev/null \
            || { echo "::error::R2 credentials failed a test read of the dataset bucket"; exit 1; }

      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$MODEL" in
            gfs|sflux|ecmwf|ifs|aifs|ifshres|hrrr|rrfs|woofnam|gefsaero|cmadust|silam|cfs|iconeu|arpege|cmageps) ;;
            *) echo "::error::unknown source: $MODEL"; exit 1 ;;
          esac
          case "$PROFILE" in
            balanced|quality|compact) ;;
            *) echo "::error::unknown profile: $PROFILE"; exit 1 ;;
          esac
          printf '%s' "$RUN_INPUT" | grep -Eq '^(latest|[0-9]{10})$' \
            || { echo "::error::run must be latest or YYYYMMDDHH"; exit 1; }
          printf '%s' "$KEEP" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::keep must be a positive integer"; exit 1; }
          printf '%s' "$MAX_JOBS" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::max_jobs must be a positive integer"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      # When R2 already serves the newest available cycle — the schedule
      # fires on a fixed clock, but a source can be late or a cycle can be
      # published twice — there is nothing to do unless the source has
      # started publishing bundles that run does not carry: then the run is
      # *topped up*, only those bundles built and merged onto the manifest
      # the bucket holds (saved here as the finalize job's base). A dry run
      # never skips and never tops up: its whole point is to exercise the
      # whole pipeline and preview the writes. `force` rebuilds everything.
      - name: Resolve the run to publish
        id: target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # The whole axis the source publishes (240 hours for the global
          # models, 18 for HRRR) — the same default `build-bin` and
          # `assemble-run` take below when given no --hours.
          run=$(uv run python -c "from xuebuild.fetch import resolve_run; from xuebuild.sources import source_spec; print(resolve_run('${RUN_INPUT}', hours=source_spec('${MODEL}').horizon_hours, model='${MODEL}').id)")
          live=$(make -s live-run MODEL="$MODEL" || true)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          pointer=$(make -s live-pointer MODEL="$MODEL")
          seen=$(printf '%s' "$pointer" | jq -r '"\(.run):\(.manifestCrc32)"')
          echo "live=$seen" >> "$GITHUB_OUTPUT"
          if [ "$run" = "$live" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$run" = "$live" ] && [ "$FORCE" != "true" ] && [ -z "$DRY_RUN" ]; then
            make -s live-manifest MODEL="$MODEL" > live-manifest.json
            # The shared stores' group documents of the same live run: a
            # top-up merges its parts onto them (docs/zarr-profile.md).
            make -s live-store-groups MODEL="$MODEL" RUN="$run" LIVE_MANIFEST=live-manifest.json OUT=live-stores
            missing=$(uv run python -m xuebuild bundle-groups --model "$MODEL" --max-jobs "$MAX_JOBS" \
              --base-manifest live-manifest.json | jq -r '[.[].group] | join(" ")')
            if [ -z "$missing" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "topup=false" >> "$GITHUB_OUTPUT"
              echo "R2 already serves $MODEL run $run with every published bundle, nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "topup=true" >> "$GITHUB_OUTPUT"
              echo "Topping up $MODEL run $run, which R2 serves without: $missing." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "topup=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $MODEL run $run (live: ${live:-none})." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The live manifest and group documents travel to the finalize job as
      # they were read here, so the top-up merges onto exactly the run the
      # missing set was computed against.
      - uses: actions/upload-artifact@v4
        if: ${{ steps.target.outputs.topup == 'true' }}
        with:
          name: base-${{ inputs.model }}
          path: |
            live-manifest.json
            live-stores/
          retention-days: 3
          if-no-files-found: error

      # The build matrix: which bundles each job packs, whether it needs
      # ffmpeg for an H.264 companion, and the slug its files go by — every
      # published bundle, or for a top-up only the ones the live run lacks.
      # Computed even for a skipped publish so the matrix expression below
      # always has JSON to parse.
      - name: Split the run into build jobs
        id: groups
        env:
          TOPUP: ${{ steps.target.outputs.topup }}
        run: |
          set -euo pipefail
          base=""
          [ "$TOPUP" != "true" ] || base="--base-manifest live-manifest.json"
          # shellcheck disable=SC2086 # the base flag is deliberately unquoted
          groups=$(uv run python -m xuebuild bundle-groups --model "$MODEL" --max-jobs "$MAX_JOBS" $base)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          {
            echo "### $MODEL build jobs"
            echo
            printf '%s' "$groups" | jq -r '.[] | "- `\(.group)`" + (if .eccodes then " (eccodes)" else "" end)'
          } >> "$GITHUB_STEP_SUMMARY"

      # Whether the columns job has work: the source ships a column store (`sources.COLUMN_STORE_SOURCES`) and
      # the run it will end up serving lacks its store. Decided here, where
      # the live manifest of a skipped run is already at hand, so a source
      # with none never starts the job. A dry run writes
      # nothing, so it has none either.
      - name: Decide whether the run needs a column store
        id: columns
        env:
          SKIP: ${{ steps.target.outputs.skip }}
          FRESH: ${{ steps.target.outputs.fresh }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          has=$(uv run python -c "import sys; from xuebuild.sources import source_spec; print('true' if source_spec(sys.argv[1]).column_arrays else 'false')" "$MODEL")
          if [ -n "$DRY_RUN" ] || [ "$has" != true ]; then
            columns=false
          elif [ "$SKIP" != true ]; then
            # A run R2 does not serve yet carries no store: the columns job cuts
            # one before finalize. A top-up or a forced rebuild of the live run
            # does not cut before the flip (finalize keeps its base's store when no
            # member was rebuilt and goes live without one otherwise; the next
            # scheduled publish attaches it), so what a live ?v= names never moves
            # on a cut.
            columns=$FRESH
          else
            # R2 serves this run already: a failed earlier attempt left it
            # without its store, a finished one did not. Or one died between
            # the manifest naming the store and the pointer carrying that
            # manifest's CRC-32: the job then only finishes the flip (or fails
            # loudly when the manifest differs in more than `columns`).
            columns=$(uv run python -m xuebuild columns-missing --model "$MODEL" --base-manifest live-manifest.json)
            if [ "$columns" != true ]; then
              pointer=$(make -s live-pointer MODEL="$MODEL")
              want=$(printf '%s' "$pointer" | jq -r '.manifestCrc32 // empty')
              have=$(uv run python -c "import sys, zlib; print(f'{zlib.crc32(open(sys.argv[1], \"rb\").read()) & 0xFFFFFFFF:08x}')" live-manifest.json)
              if [ -n "$want" ] && [ "$want" != "$have" ]; then
                columns=true
              fi
            fi
          fi
          echo "columns=$columns" >> "$GITHUB_OUTPUT"
          [ "$columns" != true ] || echo "$MODEL run needs its column store." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ inputs.model }} ${{ matrix.group }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.groups) }}
    env:
      MODEL: ${{ inputs.model }}
      RUN: ${{ needs.resolve.outputs.run }}
      PROFILE: ${{ inputs.profile }}
      GROUP: ${{ matrix.group }}
      SLUG: ${{ matrix.slug }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Planes compress in-process through the stdlib zstd module.
          python-version: "3.14"

      # The SILAM fetch reads FMI's NetCDF-4 day files through netCDF4, a
      # dependency group of its own; every other source's fetch needs none.
      - name: Sync Python environment
        run: uv sync ${{ inputs.model == 'silam' && '--group silam' || '' }}

      # No GDAL. This job converts through the native encoder (XUE_ENCODER is
      # pinned to `native` above) and the xuepy wheel carries its own — for
      # extraction, and through `xue.gdal_info` for the inspection pass that
      # used to shell out to `gdalinfo`. The dependency pin requires a wheel
      # carrying it (`xuepy>=0.20`), so `uv sync` above fails rather than
      # letting a build reach a `gdalinfo` that is not here. The floor is
      # also what keeps a wheel whose decoder predates container v2 out of
      # this job: the build reads every bundle back through it.
      #
      # A source whose feed arrives CCSDS packed (`SourceSpec.packing`: the
      # ECMWF open data, DWD ICON-EU, Météo-France ARPEGE) is repacked with
      # eccodes at fetch time because GDAL builds usually lack libaec (and
      # ARPEGE's zero analysis accumulation is written with it), and one
      # that arrives JPEG2000 packed (CMA GRAPES GEPS, whose ensemble
      # products are also rewritten to plain templates with it) likewise,
      # so the matrix flags every job of such a source `eccodes`.
      - name: Install eccodes
        if: ${{ matrix.eccodes }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libeccodes-tools

      # The one source whose fetch stage is a tool of its own: `ifshres` is
      # not GRIB but Open-Meteo's forwarding of ECMWF IFS HRES in the `.om`
      # format, and om2nc reads the byte ranges of this group's variables
      # and writes them as the NetCDF series both encoders already read
      # (docs/contribution/sources.md, "ifshres"). It is a GPL-2.0-only standalone
      # binary: xuebuild only ever runs it as a subprocess, so it arrives
      # here as an executable on the PATH and nothing links it. The action
      # (ringsaturn/setup-om2nc, MIT) installs one release, pinned here by
      # version *and* by the checksum its SHA256SUMS publishes for this
      # runner's target, so a replaced asset fails the job instead of
      # running.
      - name: Install om2nc
        if: ${{ inputs.model == 'ifshres' }}
        uses: ringsaturn/setup-om2nc@v1
        with:
          version: v0.1.1
          sha256: df285889d5b703894ba365929a316d2c692fda2ea962c8a512de4f65dbbfd9d1 # x86_64-unknown-linux-gnu

      # Only this group's GRIB records come down, and only its bundles are
      # packed; the manifest written is a part (manifest.part.<slug>.json),
      # and so is each shared store's group document
      # (bundles*.zarr/zarr.part.<first bundle>.json), for the finalize job
      # to merge.
      - name: Build ${{ matrix.group }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # the group is a space-separated list
          uv run python -m xuebuild -v build-bin \
            --model "$MODEL" --run "$RUN" --profile "$PROFILE" \
            --bundles $GROUP \
            > "build-report-$SLUG.json"
          {
            echo "### $MODEL $RUN: $GROUP"
            echo
            echo '```json'
            jq '{bundles: [.bundles[] | {variable, byteLength: .zarr.byteLength, crc32: .zarr.crc32}]}' "build-report-$SLUG.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `aws s3 sync` of what this job built into the run directory
      # (immutable, ?v=<crc32>-addressed, unreferenced until the pointer
      # flips), then one pass over those objects through the CDN so the
      # edge holds them before anyone asks (scripts/warm_edge_cache.sh) —
      # all but the shared stores' arrays, whose ?v= is the group document
      # the finalize job writes, so that job warms them.
      - name: Upload the bundles to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make upload-r2-bundles MODEL="$MODEL" RUN="$RUN" DRY_RUN="$DRY_RUN"

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ inputs.model }}-${{ matrix.slug }}
          path: |
            web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/manifest.part.*.json
            web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/bundles*.zarr/zarr.part.*.json
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: build-report-${{ inputs.model }}-${{ matrix.slug }}
          path: build-report-${{ matrix.slug }}.json
          retention-days: 14
          if-no-files-found: ignore

  # Between build and finalize, only for a source that ships a column store.
  #
  # Cut mode (build succeeded, and R2 serves another run than this one: a top-up
  # or forced rebuild of the live run never cuts here): assemble the parts
  # locally exactly as finalize will, cut the store from the shards the build
  # jobs put on R2 against the group documents just assembled, upload and warm
  # it, and leave `columns.json` as an artifact, last, for finalize to name in
  # its one manifest. Nothing live changes here. The cut gets 30 minutes
  # (`timeout` inside the job's budget, so an overrun fails the step instead of
  # cancelling the job and, with it, the workflow): past that, or on any error,
  # finalize takes the run live without the store and the next scheduled
  # publish attaches it.
  #
  # Attach mode (resolve said skip: R2 serves this run without its store): the
  # run is live, so it is cut from R2's own objects and attached with a second
  # manifest and pointer write (`make publish-columns`, mk/r2.mk), each write
  # behind a check that the pointer still names this run. 52 minutes.
  #
  # continue-on-error: a failure marks this job red and warns, but leaves the
  # workflow green, so the run metrics (docs/metrics.md) never read a live run
  # as a failed publish. The job's name does not match `finalize <model> <run>`.
  # It holds the caller's concurrency group while it works, like every job.
  columns:
    name: columns ${{ inputs.model }} ${{ needs.resolve.outputs.run }}
    needs: [resolve, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success'
      && needs.resolve.outputs.columns == 'true'
      && (needs.build.result == 'success' || needs.resolve.outputs.skip == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODEL: ${{ inputs.model }}
      RUN: ${{ needs.resolve.outputs.run }}
      ATTACH: ${{ needs.resolve.outputs.skip }}
      # The store is written by the wheel's native writer (xue.write_columns),
      # named here though the workflow already pins it: a locked wheel that
      # lacks the function fails this job loudly instead of falling back to the
      # slow reference writer. Only this job fails, never the run.
      XUE_ENCODER: native
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.skip != 'true' }}
        with:
          pattern: part-${{ inputs.model }}-*
          merge-multiple: true
          path: web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}

      # The same merge finalize does, from the same parts and base, so the
      # group documents and the manifest here are the ones finalize writes
      # (`build-columns` checks every group document against the manifest's
      # CRC-32 and wants the pointer assemble-run writes). Local only.
      - name: Assemble the run locally
        if: ${{ needs.resolve.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          uv run python -m xuebuild -v assemble-run --model "$MODEL" --run "$RUN" > assemble-report.json

      - name: Cut the column store
        id: cut
        if: ${{ needs.resolve.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LIVE_SEEN: ${{ needs.resolve.outputs.live }}
        run: timeout --kill-after=60 30m make cut-columns MODEL="$MODEL" RUN="$RUN" LIVE_SEEN="$LIVE_SEEN"

      - name: Attach the column store to the live run
        if: ${{ needs.resolve.outputs.skip == 'true' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # The job's own timeout is a cancellation, which would turn the
        # workflow's conclusion cancelled; this one fails the step instead,
        # inside the job's budget, so continue-on-error absorbs it.
        run: timeout --kill-after=60 52m make publish-columns MODEL="$MODEL" RUN="$RUN"

      - name: Report the column store
        if: ${{ always() }}
        run: |
          if [ -s columns-report.json ]; then
            {
              echo "### $MODEL $RUN columns"
              echo
              echo '```json'
              cat columns-report.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say what the column store lacks
        if: ${{ failure() || cancelled() }}
        run: |
          if [ "$ATTACH" = true ]; then
            echo "::warning::$MODEL run $RUN is live without its column store (or with a manifest its pointer does not carry yet); the next publish of this source retries it"
          else
            echo "::warning::$MODEL run $RUN goes live without its column store; the next publish of this source attaches it"
          fi

      # Right after the cut, whatever follows: its presence is what tells
      # finalize the store is on R2, and it is written only when `cut-columns`
      # finished. The warm-up below may be slow or fail without costing the store.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.cut.outcome == 'success' && needs.resolve.outputs.skip != 'true' }}
        with:
          name: columns-${{ inputs.model }}-${{ needs.resolve.outputs.run }}
          path: columns.json
          retention-days: 3
          if-no-files-found: ignore

      # Bounded on its own (never the 30 minutes of the cut) and never failing
      # the job: the store is already on R2, a cold edge is only slower.
      - name: Warm the column store
        if: ${{ !cancelled() && steps.cut.outcome == 'success' && needs.resolve.outputs.skip != 'true' && !inputs.dry_run }}
        run: |
          [ -s columns.json ] || exit 0
          timeout --kill-after=30 5m scripts/warm_edge_cache.sh "$MODEL" "$RUN" --columns \
            || echo "::warning::warming the column store failed or took over five minutes; it goes live cold"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: columns-report-${{ inputs.model }}
          path: columns-report.json
          retention-days: 14
          if-no-files-found: ignore

  # The run in the name is how the run metrics (docs/metrics.md) tell which
  # cycle this job took live; keep the `finalize <model> <run>` shape.
  #
  # `needs: columns` orders it after the cut; the condition is written out
  # because a status-less `if` keeps an implicit success() over every need, and
  # the columns job must never decide whether a run goes live: it may have
  # succeeded, failed (continue-on-error), been skipped or left no descriptor.
  # What finalize needs is the build, so `!cancelled()` plus the build's own
  # result.
  finalize:
    name: finalize ${{ inputs.model }} ${{ needs.resolve.outputs.run }}
    needs: [resolve, build, columns]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success'
      && needs.resolve.outputs.skip != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODEL: ${{ inputs.model }}
      RUN: ${{ needs.resolve.outputs.run }}
      TOPUP: ${{ needs.resolve.outputs.topup }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ inputs.model }}-*
          merge-multiple: true
          path: web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.topup == 'true' }}
        with:
          name: base-${{ inputs.model }}

      # The column store's descriptor, when the columns job cut one and
      # finished: it uploads the artifact right after the cut, so an artifact
      # means a store on R2. By pattern, so a missing one (a failed, timed-out
      # or skipped cut, the ordinary outcome) is no error while a real download
      # failure still is. `assemble-run --columns` binds it to this run and
      # these group documents or drops it with a warning.
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.columns == 'true' }}
        with:
          pattern: columns-${{ inputs.model }}-${{ needs.resolve.outputs.run }}
          merge-multiple: true

      # The parts merge into the run's manifest in publication order, every
      # published bundle present exactly once, and into each shared store's
      # group document, whose CRC32 every entry naming the store carries; the
      # pointer is written with the finished manifest's CRC32. For a top-up
      # they merge onto the live manifest and group documents the resolve
      # job saved, so the result is what a whole build would have written
      # today. Nothing is on this runner but the parts: the arrays are
      # already in the bucket.
      - name: Assemble the manifest
        run: |
          set -euo pipefail
          base=""
          [ "$TOPUP" != "true" ] || base="--base-manifest live-manifest.json --base-stores live-stores"
          [ ! -s columns.json ] || base="$base --columns columns.json"
          # shellcheck disable=SC2086 # the base flags are deliberately unquoted
          uv run python -m xuebuild -v assemble-run \
            --model "$MODEL" --run "$RUN" $base > assemble-report.json
          {
            echo "### $MODEL $RUN"
            echo
            echo '```json'
            jq '{model, run, byteLength, bundles, built, dropped, stac}' assemble-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Before any write: a re-run of a red job, or of an old workflow run, must
      # not take over a pointer that has moved on (mk/r2.mk, check-live-run).
      - name: Check the live pointer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          LIVE_SEEN: ${{ needs.resolve.outputs.live }}
        run: >-
          make check-live-run MODEL="$MODEL" RUN="$RUN" LIVE_SEEN="$LIVE_SEEN" DRY_RUN="$DRY_RUN"
          ABOUT_MANIFEST="web/public/data/$MODEL.$RUN/manifest.json"

      # The shared stores' group documents go up first, then the manifest,
      # immutable like the bundles it names; the edge is warmed with both
      # and the shared stores' arrays under their new ?v= (a failed warm-up
      # never holds the pointer back); then the mutable per-model live
      # pointer, which takes the run live.
      - name: Upload the manifest and take the run live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make upload-r2-manifest MODEL="$MODEL" RUN="$RUN" DRY_RUN="$DRY_RUN"

      # The pointer is served with no-cache, so the edge revalidates it; a
      # mismatch here means the flip has not propagated rather than failed,
      # so it warns instead of failing an otherwise complete publish.
      - name: Verify the live pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          latest="latest.json"
          [ "$MODEL" = "gfs" ] || latest="latest-${MODEL}.json"
          url="https://dataset.ringsaturn.me/xue/${latest}"
          published=$(curl -fsSL "$url" | jq -r '.run' || true)
          if [ "$published" = "$RUN" ]; then
            echo "$url serves run $published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$url serves '${published:-nothing}', expected $RUN"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: publish-report-${{ inputs.model }}
          path: |
            assemble-report.json
            web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/manifest.json
            web/public/data/${{ inputs.model }}.${{ needs.resolve.outputs.run }}/item.json
            web/public/data/${{ inputs.model }}/collection.json
            web/public/data/catalog.json
            web/public/data/latest*.json
          retention-days: 14
          if-no-files-found: ignore

  # Its own job, after the run is live: finalize used to delete the runs it
  # superseded straight after the pointer flip, but a viewer's shell reads the
  # live pointer every five minutes and until then keeps asking for the old
  # run's objects, which pruning would turn into 404s. So wait out the poll
  # interval (six minutes), then delete. A dry run writes nothing and does not
  # wait. A failure here fails the workflow as it did inside finalize, and the
  # run metrics are unaffected: they read finalize's pointer step. The caller's
  # concurrency group is held six minutes longer, which no cron here
  # (hourly at the shortest) outlasts.
  prune:
    name: prune ${{ inputs.model }}
    needs: [resolve, finalize]
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODEL: ${{ inputs.model }}
      KEEP: ${{ inputs.keep }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for open pages to follow the pointer
        if: ${{ !inputs.dry_run }}
        run: sleep 360

      - name: Delete superseded runs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: make prune-r2 MODEL="$MODEL" KEEP="$KEEP" DRY_RUN="$DRY_RUN"
