name: publish cfs

# NCEP CFSv2, the operational coupled climate forecast: ensemble member 01
# of the 00Z and 12Z cycles, six-hourly from hour 6 to hour 6552 — the
# thirty-nine weeks every cycle reaches of a nine-month run, 1092 frames on
# the T126 Gaussian grid. The pipeline lives in the reusable publish.yml;
# this file only owns the schedule and the manual knobs.
#
# The horizon is a calendar, not a count: a run ends at the first 00Z of
# the tenth calendar month after its cycle, which is 6564 to 6888 hours
# depending on the date, so the published axis is the 6552 every cycle has.
# The source is also fetched series-major — one object per variable holding
# the whole run, split into frames here — and those objects are written as
# the model runs, so `--run latest` only accepts a cycle whose sidecars name
# the hour 6552 record *and* whose objects measure that far
# (xuebuild/fetch.py, `_cfs_run_is_complete`); a cycle still being written is
# skipped rather than half-published.

on:
  schedule:
    # The time series complete a little before 11:30Z for the 00Z cycle and
    # 23:25Z for the 12Z one (measured 2026-09-16 through 2026-09-19, the
    # four days consistent). Publishing a quarter of an hour after that.
    - cron: "45 11,23 * * *"
    # A second idempotent pass recovers from a temporary upstream outage.
    # publish.yml exits early when the first pass already made the run live.
    - cron: "45 12,0 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Cycle to publish: latest or YYYYMMDDHH (00 or 12 UTC)"
        type: string
        default: latest
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (1 = live run only)"
        type: string
        default: "1"
      force:
        description: "Rebuild even when R2 already serves this run"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what pruning would delete, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-cfs
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/publish.yml
    with:
      model: cfs
      run: ${{ inputs.run || 'latest' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '1' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      # Published as Zarr stores alone.
      zarr: true
      container: false
    secrets: inherit
