name: publish jma

# The JMA precipitation nowcast (高解像度降水ナウキャスト): the agency's
# precipitation intensity analysis over Japan, a frame every five minutes,
# published on its website as map tiles. The live feed is a rolling window
# — the last two whole hours plus the hour in progress, the three hours
# the agency's listing reaches back, on a 0.01° grid, the native
# five-minute step — rebuilt every five minutes into a round subdirectory
# of its run (<model>.<run>/<HHMM>/) and pointed at by latest-jma.json.
#
# Unlike publish-mrms.yml, which keeps one job an hour looping the rounds
# itself, this runs one round per job on a five-minute cron (the finest
# GitHub offers): a job is a few minutes of runner time and the listing
# never shows a job in progress for an hour, which keeps the workflow
# recognisably a publish step rather than a resident service (the Actions
# terms rule out running "part of a serverless application" on hosted
# runners). The cost is freshness: GitHub starts a scheduled run ten to
# twenty minutes late and skips some under load, and each round is
# published that much after its frame. A dispatch with `loop` on runs the
# rounds until the deadline, as the hourly shape did. The frames are
# fetched and decoded by the jma-radar tool
# (https://github.com/ringsaturn/jma-radar, installed into the project
# environment here; xuebuild/jmacli.py drives it), and its decoded-frame
# cache is mirrored on the bucket (`make pull-r2-frames` / `push-r2-frames`)
# so the agency's tiles are fetched once, not once per runner: a round
# asks it for one new frame. And the window is three hours rather than
# four, since the listing is three hours deep.
#
# Machine time: twelve jobs an hour of two to three minutes each, roughly
# 360 hours a month, free on a public repository's standard runners.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Keep running rounds until twenty past the next hour instead of one round"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds when looping"
        type: string
        default: "2"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress; the listing reaches three hours back)"
        type: string
        default: "3"
      encoder:
        description: "auto (the xuepy wheel when its release knows the jma source, else the reference pipeline with GDAL), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the bucket's newest frame"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/successor_queued.sh lists this workflow's waiting runs, for a
  # looping dispatch to yield to the next scheduled job. rounds.yml can only
  # narrow what it is granted here.
  actions: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-jma-dry-{0}', github.run_id) || 'publish-jma' }}
  # A late cron queues behind the job still running and then finds
  # nothing new; a looping dispatch yields to it on its own.
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/rounds.yml
    with:
      model: jma
      hours: ${{ inputs.hours || '3' }}
      round_minutes: ${{ inputs.round_minutes || '2' }}
      loop: ${{ inputs.loop || false }}
      encoder: ${{ inputs.encoder || 'auto' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '2' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      pip_install: "git+https://github.com/ringsaturn/jma-radar"
      gdal: fallback
      frame_cache: true
    secrets: inherit
