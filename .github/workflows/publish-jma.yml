name: publish jma

# The JMA precipitation nowcast (高解像度降水ナウキャスト): the agency's
# precipitation intensity analysis over Japan, a frame every five minutes,
# published on its website as map tiles. The live feed is a rolling window
# — the last two whole hours plus the hour in progress, the three hours
# the agency's listing reaches back, on a 0.01° grid, the native
# five-minute step — rebuilt every five minutes into a round subdirectory
# of its run (<model>.<run>/<HHMM>/) and pointed at by latest-jma.json.
#
# The same shape as publish-mrms.yml: one job an hour runs the rounds
# itself (scripts/window_rounds.sh, MODEL=jma). Three things differ. The
# rounds come every two minutes rather than five, and a job runs on to
# twenty past the next hour instead of stopping at five to: GitHub starts
# an hourly cron ten to twenty minutes late, and a job that stopped at :55
# left the feed unattended until the next one arrived. A scheduled run
# cancels the job still running (the concurrency group below), so the
# hand-off happens whenever the cron actually fires; a round cut off
# mid-way costs nothing, since the pointer is the last thing a round
# writes and the previous round stays live. A manual dispatch waits its
# turn instead of cancelling anything. The frames are fetched and decoded
# by the jma-radar tool
# (https://github.com/ringsaturn/jma-radar, installed into the project
# environment here; xuebuild/jmacli.py drives it), and its decoded-frame
# cache is mirrored on the bucket (`make pull-r2-frames` / `push-r2-frames`)
# so the agency's tiles are fetched once, not once per runner: a round
# asks it for one new frame. And the window is three hours rather than
# four, since the listing is three hours deep.
#
# Machine time: a job an hour, each about eighty minutes, so roughly 960
# hours a month, free on a public repository's standard runners.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "Run one round and stop, instead of the rest of the hour"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds"
        type: string
        default: "2"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress; the listing reaches three hours back)"
        type: string
        default: "3"
      encoder:
        description: "auto (the xuepy wheel when its release knows the jma source, else the reference pipeline with GDAL), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the bucket's newest frame"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-jma
  # The hourly cron takes over from the job still running, whenever it
  # fires; a dispatch queues behind whatever is running.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  # Which encoder the rounds convert through. The other publish-* workflows
  # pin XUE_ENCODER=native so a fall back to the reference pipeline fails
  # instead of passing unnoticed; here the wheel on PyPI may predate the
  # source (a scheduled run cannot pass an input, and a wheel is released
  # on the crate's tags, not with every source), so `auto` resolves the
  # choice in the job below — native when the installed wheel knows the
  # model, else the reference pipeline with a ::warning:: on the run — and
  # the dispatch can still insist on either.
  ENCODER: ${{ inputs.encoder || 'auto' }}
  # Every round is published as Zarr stores alone (plan 017 phase 7): the
  # store is derived from the `.xue` the round wrote and the file retired
  # before upload. A round's export is a fraction of its build.
  XUE_ZARR: "1"
  XUE_CONTAINER: "0"

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    runs-on: ubuntu-24.04
    # The rounds stop at twenty past the next hour on their own (UNTIL_MINUTE
    # below) and the next cron normally cancels the job before that; this is
    # the backstop for a round that hangs.
    timeout-minutes: 90
    env:
      MODEL: jma
      FRAME_CACHE: "true"
      ONCE: ${{ inputs.once || false }}
      ROUND_MINUTES: ${{ inputs.round_minutes || '2' }}
      # Past the hour: the next cron's job cancels this one when it starts,
      # and this deadline only matters when that cron is later than usual.
      UNTIL_MINUTE: "80"
      HOURS: ${{ inputs.hours || '3' }}
      PROFILE: ${{ inputs.profile || 'balanced' }}
      KEEP: ${{ inputs.keep || '2' }}
      FORCE: ${{ inputs.force || false }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          printf '%s' "$ROUND_MINUTES" | grep -Eq '^[1-9][0-9]?$' \
            || { echo "::error::round_minutes must be a positive integer of minutes"; exit 1; }
          printf '%s' "$HOURS" | grep -Eq '^[1-9][0-9]?$' \
            || { echo "::error::hours must be a positive integer"; exit 1; }
          printf '%s' "$KEEP" | grep -Eq '^[1-9][0-9]*$' \
            || { echo "::error::keep must be a positive integer"; exit 1; }

      # The AWS CLI is preinstalled on the runner; R2 is its S3 endpoint.
      # The credentials are step-scoped rather than job env, so third-party
      # actions never see them; the listing proves they work before the
      # first round rather than at its upload.
      - name: Check R2 credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty; set the R2 repository secrets"; exit 1; }
          done
          aws --version
          aws s3 ls "s3://dataset/xue/" --region auto \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" > /dev/null \
            || { echo "::error::R2 credentials failed a test listing of the dataset bucket"; exit 1; }

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      # No ffmpeg: the source ships no video. The xuepy wheel carries the
      # GDAL the native encoder extracts and inspects with; the reference
      # pipeline needs the system one.
      - name: Sync Python environment
        run: uv sync

      - name: Install the jma-radar tool
        run: uv pip install --python .venv/bin/python "git+https://github.com/ringsaturn/jma-radar"

      # XUE_ENCODER is what xuebuild reads (auto | native | python); it is
      # set here rather than at the workflow level so a wheel that predates
      # the source resolves to the reference pipeline explicitly, once, and
      # every later step (the GDAL install, the rounds) sees one answer.
      # `auto` on the xuebuild side would take the wheel whenever it imports
      # and only fail inside the round, as the scheduled runs did.
      - name: Resolve the encoder
        run: |
          set -euo pipefail
          case "$ENCODER" in
            native|python) encoder="$ENCODER" ;;
            auto)
              if .venv/bin/python -c "import sys; from xuebuild import native; sys.exit(0 if native.knows_source('$MODEL') else 1)"; then
                encoder=native
              else
                wheel=$(.venv/bin/python -c "from xuebuild import native; print(native.version() or 'unknown')")
                echo "::warning::xuepy ${wheel} does not know the ${MODEL} source; converting through the reference pipeline (slower). Release a wheel that carries it and bump the pin in pyproject.toml."
                encoder=python
              fi ;;
            *) echo "::error::encoder must be auto, native or python, not '$ENCODER'"; exit 1 ;;
          esac
          echo "XUE_ENCODER=$encoder" >> "$GITHUB_ENV"
          echo "encoder: $encoder" >> "$GITHUB_STEP_SUMMARY"

      - name: Install GDAL for the reference pipeline
        if: ${{ env.XUE_ENCODER == 'python' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          gdalinfo --version

      - name: Run the rounds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          scripts/window_rounds.sh 2>&1 | tee rounds.log
          status=$?
          {
            echo "### jma rounds"
            echo
            echo '```'
            grep -E '^round [0-9]{4}:|rounds this hour' rounds.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The pointer is served with no-cache, so the edge revalidates it; a
      # stale read here means the last flip has not propagated rather than
      # failed, so it warns instead of failing an otherwise complete hour.
      - name: Verify the live pointer
        if: ${{ !inputs.dry_run }}
        run: |
          set -uo pipefail
          [ -f web/public/data/latest-jma.json ] || { echo "No round built this hour." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          url="https://dataset.ringsaturn.me/xue/latest-jma.json"
          published=$(curl -fsSL "$url" | jq -r '.manifestPath' || true)
          if [ -n "$published" ] && [ -f "web/public/data/$published" ]; then
            echo "$url serves $published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::$url serves '${published:-nothing}', not the round this job last built"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: publish-report-jma
          path: |
            rounds.log
            build-report.json
            web/public/data/latest-jma.json
          retention-days: 14
          if-no-files-found: ignore
