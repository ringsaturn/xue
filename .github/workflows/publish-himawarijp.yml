name: publish himawarijp

# Himawari-9 over Japan at 0.01°: the same JMA imager NOAA redistributes on
# its open data bucket as publish-himawari.yml reads (the ISatSS full-disk
# product, 88 calibrated NetCDF tiles a channel a scan), cut to the box
# 24–46°N, 122–148°E. The live feed is a rolling window — the last two
# whole hours plus the hour in progress, warped onto a 0.01° plate carrée
# grid (2600 x 2200), the native ten-minute step — rebuilt every ten
# minutes into a round subdirectory of its run (<model>.<run>/<HHMM>/) and
# pointed at by latest-himawarijp.json. It publishes the 10.4 µm window,
# the Dust RGB and the true colour (by day and by night); no dust
# confidence, so no ANCILLARY.
#
# The shape is publish-himawari.yml's. A round lists the newest complete
# scan and fetches only the six tiles per channel that reach the box
# (T009–T011, T018–T020; some 60 MB a slot over the eight channels other
# than 3.9 µm by day, 35 by night, against the disk's 870 and 500), warps
# them once (xuebuild/satellite/, through the system GDAL's gdalwarp — the
# xuepy wheel's GDAL carries no GeoTIFF driver, so this workflow installs
# gdal-bin whichever encoder converts), caches the frames on the bucket
# under himawarijp-frames/, apart from the disk's (`make pull-r2-frames` /
# `push-r2-frames`), and stacks the window's frames into the NetCDF series
# the converter reads. A sunlit hour of stores is some 220 MB, so a round
# uploads up to some 650 MB by day and half that at night, when the true
# colour is empty.
#
# Machine time: six jobs an hour of a few minutes each, free on a public
# repository's standard runners.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Keep running rounds until twenty past the next hour instead of one round"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds when looping"
        type: string
        default: "5"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress)"
        type: string
        default: "3"
      encoder:
        description: "auto (the xuepy wheel when its release knows the himawarijp source, else the reference pipeline), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the bucket's newest frame"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/successor_queued.sh lists this workflow's waiting runs, for a
  # looping dispatch to yield to the next scheduled job. rounds.yml can only
  # narrow what it is granted here.
  actions: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-himawarijp-dry-{0}', github.run_id) || 'publish-himawarijp' }}
  # A late cron queues behind the job still running and then finds
  # nothing new; a looping dispatch yields to it on its own.
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/rounds.yml
    with:
      model: himawarijp
      hours: ${{ inputs.hours || '3' }}
      round_minutes: ${{ inputs.round_minutes || '5' }}
      loop: ${{ inputs.loop || false }}
      encoder: ${{ inputs.encoder || 'auto' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '2' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      uv_group: satellite
      gdal: always
      frame_cache: true
      frames_keep_hours: "5"
    secrets: inherit
