name: release-crate

# Publishes the rust/xue core crate to crates.io when a v* tag is pushed.
# xue-wasm is deliberately never published (its wasm output is
# build-generated and consumed straight from the repo).
#
# Authentication is crates.io Trusted Publishing (GitHub OIDC, no stored
# token): the crate's Settings → Trusted Publishing must list this
# repository with workflow filename `release-crate.yml`.
#
# Manual dispatch runs the packaging rehearsal only (`cargo publish
# --dry-run`) without touching crates.io or the tag namespace.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release for the tag
      id-token: write # mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        run: |
          version="$(cargo metadata --manifest-path rust/xue/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xue") | .version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match rust/xue version ${version}" >&2
            exit 1
          fi

      # `cargo publish` itself rebuilds the packaged crate before uploading,
      # so the tag path skips the redundant rehearsal.
      - name: Package and verify (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: cargo publish -p xue --dry-run
        working-directory: rust

      - name: Authenticate with crates.io
        if: github.event_name == 'push'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: github.event_name == 'push'
        run: cargo publish -p xue
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub release
        if: github.event_name == 'push'
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
