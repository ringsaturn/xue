name: publish arpege

# Météo-France ARPEGE (0.25°, global), hourly to F048 and three-hourly to
# F102 from the 00/06/12/18Z cycles, as the surface package (SP1) of the
# data.gouv.fr ARPEGE 0.25° dataset: four multi-field GRIB2 objects per
# cycle, about 740 MB, which every build job downloads whole before cutting
# its frames. The pipeline lives in the reusable publish.yml; this file
# only owns the schedule and the manual knobs.

on:
  schedule:
    # The 00z and 12z packages are complete about three to four hours after
    # the cycle, the 06z and 18z ones about five (measured 2026-10-24/25 off
    # the objects' LastModified: 18z 23:09Z, 00z 03:50Z, 06z 11:12Z, 12z
    # 15:07Z). The first pass takes the long cycles, the second the short
    # ones; `--run latest` walks back over the cycle grid, so a late cycle is
    # skipped rather than half-published.
    - cron: "20 4,10,16,22 * * *"
    # A second idempotent pass, which also catches the later 06z and 18z.
    # publish.yml exits early when the first pass already made the run live.
    - cron: "40 5,11,17,23 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Cycle to publish: latest or YYYYMMDDHH"
        type: string
        default: latest
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (1 = live run only)"
        type: string
        default: "1"
      force:
        description: "Rebuild even when R2 already serves this run"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what pruning would delete, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-arpege-dry-{0}', github.run_id) || 'publish-arpege' }}
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/publish.yml
    with:
      model: arpege
      run: ${{ inputs.run || 'latest' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '1' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      # Every job downloads the whole packages (the records it needs are
      # spread through all four), so few jobs.
      max_jobs: 2
    secrets: inherit
