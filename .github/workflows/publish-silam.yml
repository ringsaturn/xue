name: publish silam

# SILAM v6.1, the Finnish Meteorological Institute's global air-quality
# forecast, on its 0.2° grid, hourly from F001 to F072 and 3-hourly to F120
# (88 frames) from the 00Z cycle: the surface PM2.5 and PM10. It is read
# from FMI's AWS open data bucket, one NetCDF-4 file per field and forecast
# day, so the build job syncs the `silam` dependency group (netCDF4). The
# pipeline lives in the reusable publish.yml; this file only owns the
# schedule and the manual knobs.

on:
  schedule:
    # The whole 00Z run lands at once, about 05:07Z (measured 2026-11-02
    # and 2026-11-03), so this leaves forty minutes of slack. `--run
    # latest` walks back over the daily cycle grid and takes a run only once
    # the bucket holds every day file, so a late run is skipped rather than
    # half-published and picked up by the next pass.
    - cron: "45 5 * * *"
    # A second idempotent pass recovers from a late cycle or a temporary
    # server outage. publish.yml exits early when the first pass already
    # made the run live.
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "Cycle to publish: latest or YYYYMMDDHH (00Z)"
        type: string
        default: latest
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (1 = live run only)"
        type: string
        default: "1"
      force:
        description: "Rebuild even when R2 already serves this run"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what pruning would delete, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-silam-dry-{0}', github.run_id) || 'publish-silam' }}
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/publish.yml
    with:
      model: silam
      run: ${{ inputs.run || 'latest' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '1' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      # Two bundles, one job each: a job fetches its own field's five day
      # files and holds its 570 MB series in memory.
      max_jobs: 2
    secrets: inherit
