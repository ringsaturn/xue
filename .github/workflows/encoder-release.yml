name: encoder release

# One tag releases the experimental native encoder three ways: the xue-encode
# crate to crates.io, a wheel per platform attached to a GitHub release, and —
# through encoder-index.yml — a PEP 503 index over those wheels.
#
#   git tag encoder-v0.1.0 && git push origin encoder-v0.1.0
#
# The tag namespace is separate from the decoder crate's v* tags, which
# release-crate.yml owns, because the two crates version independently.
#
# The wheels are deliberately not published to PyPI: each carries its own
# GDAL, and it is a research artifact rather than something anyone should take
# a dependency on. The crate is another matter — it needs a system GDAL like
# any other GDAL binding, and behaves like one.
#
# A manual dispatch builds and uploads the wheels as workflow artifacts only,
# touching neither crates.io nor a release.

on:
  push:
    tags: ["encoder-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No macos-13: the Intel macOS runners are scarce enough that a job
        # can sit queued past the point of being useful, and every platform
        # here builds GDAL from source. Add it back when an x86_64 macOS wheel
        # is actually wanted.
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5

      # PROJ needs sqlite3 and the repair step needs patchelf; macOS gets both
      # equivalents from the SDK and from delocate.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake libsqlite3-dev sqlite3 zlib1g-dev patchelf

      # GDAL, PROJ, HDF5 and netCDF are built from source and take the bulk of
      # the job. The key is the build script itself: it pins every version, so
      # a change to it is exactly when the prefix must be rebuilt.
      - name: Cache the minimal GDAL prefix
        uses: actions/cache@v4
        with:
          path: rust/xue-encode/build/gdal-minimal
          key: gdal-minimal-${{ matrix.runner }}-${{ hashFiles('rust/xue-encode/scripts/build-gdal-minimal.sh') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/xue-encode

      - name: Build the wheel
        run: ./scripts/build-wheel.sh "${GITHUB_WORKSPACE}/wheels"
        working-directory: rust/xue-encode

      # The wheel bundles its own GDAL, so the only thing worth proving here is
      # that it finds it: import the module and run one stage against a known
      # answer.
      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          uv venv --python 3.12 /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install numpy "$(ls "${GITHUB_WORKSPACE}"/wheels/*.whl)"
          /tmp/smoke/bin/python - <<'PY'
          import numpy, xue_encode_py
          codes = xue_encode_py.quantize("quality", "tmp2m", numpy.array([-60.0, -59.75, 0.0, 50.0]))
          assert list(codes) == [0, 1, 120, 220], list(codes)
          print("wheel imports and quantizes correctly")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}
          path: wheels/*.whl
          if-no-files-found: error

  release:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/encoder-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels
      - name: Publish the release
        run: |
          set -euo pipefail
          ls -lh wheels
          gh release create "${GITHUB_REF_NAME}" wheels/*.whl \
            --title "${GITHUB_REF_NAME}" \
            --notes "Experimental native encoder. The crate is on crates.io as \`xue-encode\`; the wheels here each carry their own minimal GDAL (GRIB and netCDF drivers only) and install through the index at https://ringsaturn.github.io/xue/simple/. See rust/xue-encode/README.md." \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  crate:
    name: publish xue-encode to crates.io
    # Independent of the wheels: a crates.io outage should not cost the
    # release its binaries, and vice versa.
    if: startsWith(github.ref, 'refs/tags/encoder-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # mint the crates.io OIDC token
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo publish` builds the packaged crate to verify it, and the crate
      # links GDAL. Any GDAL will do for that check — gdal-sys generates its
      # bindings against whatever is installed — so this takes the
      # distribution one rather than the minimal build the wheels need.
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev libclang-dev

      - name: Check the tag matches the crate version
        run: |
          set -euo pipefail
          version="$(cargo metadata --manifest-path rust/xue-encode/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "xue-encode") | .version')"
          if [ "encoder-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match xue-encode version ${version}" >&2
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish -p xue-encode
        working-directory: rust/xue-encode
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
