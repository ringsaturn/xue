name: test

# Prose-only changes cannot break any suite, so they skip the whole
# workflow. Everything else — including a one-line frontend or encoder
# edit — still runs all four jobs. (The two lists are duplicated because
# the Actions parser does not support YAML anchors.)
on:
  push:
    # `release/**` so a release branch (`release/0.28`) is tested before it is
    # merged: its encoders run ahead of the published xuepy wheel, and the job
    # below builds the wheel from the tree on those branches.
    branches: [main, "release/**"]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE-*
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # wasm-pack is not on the runner image; pin the release we install.
  WASM_PACK_VERSION: v0.13.1

jobs:
  python:
    name: python 3.14
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The reference encoder shells out to GDAL. ffmpeg is what makes
      # tests/test_native.py compare real H.264 companions instead of
      # skipping them on both sides, and eccodes' bufr_dump is what lets
      # tests/test_tc.py build the tropical cyclone product from its BUFR
      # fixtures instead of skipping the golden.
      - name: Install GDAL, ffmpeg and eccodes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin ffmpeg libeccodes-tools
          gdalinfo --version
          bufr_dump -V

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      # The satellite group carries shachen (the Dust RGB producer the
      # himawari, GOES and Meteosat fetch tests run) and hdf5plugin (the
      # JPEG-LS filter the FCI fixture chunk is compressed with); the wrf
      # group carries netCDF4 for the WOOF series tool's tests.
      - name: Sync Python environment
        run: uv sync --group satellite --group wrf

      # On the release branch this tree's encoders are ahead of the last
      # published wheel, so the native parity test would compare against a
      # stale xuepy and fail by design. Build the wheel from this tree instead
      # (against the system GDAL, which the job already installs for the
      # reference pipeline); main installs the published wheel and this step
      # never runs there. A pull request from a release branch runs on the
      # merge ref, so its head branch is what names the release there; a
      # feature branch bound for a release branch is ahead of the wheel too.
      - name: Build the native encoder from this tree
        if: startsWith(github.ref_name, 'release/') || startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')
        run: |
          sudo apt-get install -y --no-install-recommends libgdal-dev libclang-dev
          make encoder-py

      # `--no-sync`: `uv run` otherwise re-syncs and replaces the xuepy the
      # step above built from this tree with PyPI's, which is exactly the
      # stale wheel a release branch must not test against. The preceding
      # `uv sync` already made the environment current.
      - name: Run Python tests
        run: uv run --no-sync python -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # tests/prepare_bin_fixture.py encodes the cropped GRIB fixture with the
      # Python encoder; the Rust decoder must reproduce it byte for byte. The
      # headers and libclang are for the native encoder's own tests below.
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libclang-dev

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # A decode-only build must stay pure Rust. The wasm jobs prove this
      # indirectly by building the decoder for a target GDAL cannot link;
      # this asserts it by name, so a dependency that stops being optional
      # fails here instead of showing up as a mystery wasm build error.
      - name: Assert the decoder pulls in no encoder dependencies
        working-directory: rust
        run: |
          ! cargo tree -p xue --edges normal \
            | grep -E 'gdal|grib|zstd-sys|rayon|regex|libc'

      - name: Run Rust tests
        run: make test-rust

      # `cargo test` leaves the `encoder` feature off, so the native
      # encoder's unit tests and its golden (the Rust encoder must write the
      # bytes the Python reference just wrote) run here, on every pull
      # request: the Python job's parity tests build the wheel on release
      # branches only, and cannot catch both tables being wrong together.
      - name: Run the native encoder's tests
        run: make encoder-rust-test

      # The API Worker links `worker`, which builds only for wasm32, so it is
      # not in `cargo test`'s default members. Compile it for that target here
      # so a broken worker fails CI rather than the deploy workflow.
      - name: Check the API Worker compiles for wasm
        working-directory: rust
        run: cargo check -p xue-worker --target wasm32-unknown-unknown

      # Its handlers compile natively too (only the Workers entry point is
      # wasm-only), so they run here over the web fixtures, which the test
      # builds with the synced Python when they are missing.
      - name: Test the API Worker's handlers
        working-directory: rust
        run: cargo test -p xue-worker

      # The same routes as a native server for a self-hosted origin
      # (docs/contribution/api-origin.md).
      - name: Check the API origin server compiles
        working-directory: rust
        run: cargo check -p xue-worker --features server --bin xue-api-server

      # A broken or private intra-doc link is how a module silently drops out
      # of the rendered page — docs.rs publishes the gap without failing.
      # --all-features is what [package.metadata.docs.rs] asks docs.rs for, and
      # DOCS_RS is gdal-sys' own escape hatch for exactly this case: prebuilt
      # bindings, no pkg-config and no headers, so this job still needs no
      # libgdal-dev.
      - name: Check the documentation builds clean
        working-directory: rust
        run: cargo doc -p xue --no-deps --all-features
        env:
          DOCS_RS: "1"
          RUSTDOCFLAGS: -D warnings

  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tests/web/zarr.test.ts builds its fixtures with
      # tests/prepare_web_fixture.py the way the Playwright global setup
      # does, so the unit-test job needs the Python environment too.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Install Node dependencies
        run: npm ci

      # web/src/wasm/ is generated and gitignored; the frontend does not
      # typecheck or build without it.
      - name: Build WASM decoder
        run: make wasm

      # The same fixtures the Playwright global setup builds; generated here
      # as a step of its own so the unit tests never wait on the encoder.
      - name: Build web fixtures
        run: .venv/bin/python tests/prepare_web_fixture.py

      - name: Run web unit tests
        run: npm run test:web

      # `npm run build` runs `tsc --noEmit` before vite build.
      - name: Typecheck and build frontend
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tests/prepare_web_fixture.py builds the synthetic bundles; it needs
      # numpy, but no GDAL.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Sync Python environment
        run: uv sync

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install wasm-pack
        run: |
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WASM_PACK_VERSION}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/wasm-pack-${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack

      - name: Install Node dependencies
        run: npm ci

      - name: Build WASM decoder
        run: make wasm

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The Playwright global setup runs tests/prepare_web_fixture.py with
      # .venv/bin/python, which `uv sync` created above.
      - name: Run end-to-end tests
        run: make test-e2e

      # playwright-report/ is the HTML report, test-results/ carries the
      # retain-on-failure traces.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
