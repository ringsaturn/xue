name: publish aurora

# The NOAA SWPC OVATION aurora probability: the chance, in percent, that
# aurora is visible overhead, on a regular 1° global grid, one model grid
# every five minutes. A space-weather observation with a live feed, like
# MRMS and the JMA nowcast: a rolling window (the last twelve hours on a
# 1° grid, the native five-minute step) rebuilt every five minutes into a
# round subdirectory of its run (<model>.<run>/<HHMM>/) and pointed at by
# latest-aurora.json.
#
# The live service keeps only the newest grid — there is no listing and no
# gridded archive (plans/027-aurora.md §2) — so the window cannot be fetched
# whole the way the JMA listing lets a round. Instead each round refreshes
# the newest grid into a frame cache under data/raw/aurora-frames/
# (xuebuild/aurora.py writes one small NetCDF per valid time) and assembles
# the window's cached frames into the series the ingest reads; the cache is
# mirrored on the bucket (`make pull-r2-frames` / `push-r2-frames`) so a
# fresh runner inherits the history and a cold window fills over hours.
# `force` never clears it: the past grids cannot be re-fetched.
#
# Machine time: twelve jobs an hour of one to two minutes each, free on a
# public repository's standard runners.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Keep running rounds until twenty past the next hour instead of one round"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds when looping"
        type: string
        default: "2"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress)"
        type: string
        default: "12"
      encoder:
        description: "auto (the xuepy wheel when its release knows the aurora source, else the reference pipeline with GDAL), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the newest grid"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/successor_queued.sh lists this workflow's waiting runs, for a
  # looping dispatch to yield to the next scheduled job. rounds.yml can only
  # narrow what it is granted here.
  actions: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-aurora-dry-{0}', github.run_id) || 'publish-aurora' }}
  # A late cron queues behind the job still running and then finds nothing
  # new; a looping dispatch yields to it on its own.
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/rounds.yml
    with:
      model: aurora
      hours: ${{ inputs.hours || '12' }}
      round_minutes: ${{ inputs.round_minutes || '2' }}
      loop: ${{ inputs.loop || false }}
      encoder: ${{ inputs.encoder || 'auto' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '2' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      uv_group: aurora
      gdal: fallback
      frame_cache: true
    secrets: inherit
