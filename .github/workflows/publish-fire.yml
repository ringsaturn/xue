name: publish fire

# The active fire product (docs/fire.md): NASA FIRMS's near-real-time VIIRS
# and MODIS detections, the last-24-hour files merged every hour onto the
# previous round's seven-day window and published as one immutable
# fire.<round>/ — a file per sensor with a line per UTC hour, and the index
# that spans them. Independent of the raster publishes — nothing here reads a
# run, and a red run does not hold this back — and cheap: four GETs of about
# 15 MB, no GDAL, no eccodes, no wheel. A first round, or one after a gap of
# more than a day, starts the window from FIRMS's last 24 hours.
#
# One round per job, no loop: at hourly cadence the schedule is the loop.

on:
  schedule:
    # FIRMS adds granules about three hours after the overpass, as they
    # arrive, so no minute is better than another; :23 keeps clear of the
    # top-of-the-hour crowd on the runners.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      round:
        description: "Round to build: now or YYYYMMDDHH00"
        type: string
        default: now
      keep:
        description: "Round directories to keep on R2 (hourly rounds)"
        type: string
        default: "6"
      dry_run:
        description: "Build and report what would be uploaded and pruned, but write nothing to R2"
        type: boolean
        default: false
      force:
        description: "Rebuild the round even when it is already live"
        type: boolean
        default: false

permissions:
  contents: read

# One at a time: the pointer is the product's only mutable object, and the
# previous round's sensor files are what this round is merged onto.
concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-fire-dry-{0}', github.run_id) || 'publish-fire' }}
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROUND: ${{ inputs.round || 'now' }}
      FIRE_KEEP: ${{ inputs.keep || '6' }}
      DRY_RUN: ${{ inputs.dry_run && '--dryrun' || '' }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      # JSON over HTTPS and the stdlib: no GDAL, no eccodes, no wheel.
      - name: Sync Python environment
        run: uv sync

      # The live index and its sensor files are this round's window: without
      # them the window starts again from FIRMS's last 24 hours.
      - name: Fetch the live index and its sensor files
        run: make live-fire-index

      # A round is immutable once the pointer names it (docs/fire.md), so a
      # round that is already live — a dispatch landed in it, or the schedule
      # ran late — is finished, not built again; `force` is the manual
      # rebuild the spec allows. The round is this hour, whatever minute the
      # runner starts at: two runs of the same round must name the same
      # directory.
      - name: Build the product
        id: build
        run: |
          set -euo pipefail
          round=$ROUND
          if [ "$round" = "now" ]; then
            round=$(date -u +%Y%m%d%H)00
          fi
          live=""
          if [ -f web/public/data/latest-fire.json ]; then
            live=$(jq -r .path web/public/data/latest-fire.json | sed -n 's:^fire\.\([0-9]\{12\}\)/index\.json$:\1:p')
          fi
          if [ "$live" = "$round" ] && [ -z "$FORCE" ]; then
            echo "fire $round is already live; nothing to build" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run python -m xuebuild -v fire-build --round "$round" $FORCE > fire-report.json
          round=$(jq -r .round fire-report.json)
          echo "round=$round" >> "$GITHUB_ENV"
          {
            echo "### fire $round"
            echo
            echo '```json'
            jq '{detections, sensors, sources: [.sources[] | "\(.id): \(if .ok then "ok \(.reports // 0) rows, \(.rejected // 0) rejected" else .error end)"], pointer}' fire-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: fire-report-${{ github.run_id }}
          path: fire-report.json
          retention-days: 14
          if-no-files-found: ignore

      # The sensor files and the index go up immutable, then the pointer
      # takes them live. A build that withheld the pointer (no FIRMS file
      # arrived) stops here with the previous round live.
      - name: Upload and take the round live
        if: steps.build.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          if [ "$(jq -r .pointer fire-report.json)" = "null" ]; then
            echo "no FIRMS file arrived; the previous round stays live" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          make upload-r2-fire ROUND="$round" DRY_RUN="$DRY_RUN"

      - name: Delete rounds older than the retention
        if: steps.build.outputs.skipped != 'true'
        run: make prune-r2-fire FIRE_KEEP="$FIRE_KEEP" DRY_RUN="$DRY_RUN"
