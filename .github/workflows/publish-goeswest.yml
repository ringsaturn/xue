name: publish goeswest

# GOES-18's 10.4 µm infrared window (ABI channel 13) and the composites
# the encoder derives from the disk's channels — the Dust RGB, the DEBRA
# and ZHOUYE dust confidences and the true colour (by day and by night)
# — from NOAA's own open data bucket: the CMIPF full-disk product, each
# channel of each ten-minute scan as one calibrated netCDF on the
# geostationary projection, landing some ten minutes after the scan
# starts. The live feed is a rolling window — the last five whole hours
# plus the hour in progress, the disk warped onto a 0.04° plate carrée
# grid (a disk across the antimeridian, spelled 163°E to 283°E), the
# native ten-minute step — rebuilt every ten minutes into a round
# subdirectory of its run (<model>.<run>/<HHMM>/) and pointed at by
# latest-goeswest.json.
#
# The shape is publish-himawari.yml's, GOES-West at 137.0°W in place of
# Himawari: one round per job on a ten-minute cron, a dispatch with
# `loop` on running rounds until the deadline. A round lists the newest
# hour directory, fetches the six windows' files (24 MB each) and the
# three solar bands' (100 MB for the 1 km ones, 430 MB for the 0.5 km red
# band by day, some 630 MB a slot in all), warps each once
# (xuebuild/satellite/, through the system GDAL's gdalwarp — the xuepy
# wheel's GDAL carries no GeoTIFF driver, so this workflow installs
# gdal-bin whichever encoder converts), composes the composites from
# them, caches the frames on the bucket (`make pull-r2-frames` /
# `push-r2-frames`), and stacks the window's frames into the NetCDF series
# the converter reads.
#
# Machine time: six jobs an hour of three to four minutes each, roughly
# 220 hours a month, free on a public repository's standard runners.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Keep running rounds until twenty past the next hour instead of one round"
        type: boolean
        default: false
      round_minutes:
        description: "Minutes between rounds when looping"
        type: string
        default: "5"
      hours:
        description: "Window length in hours (the whole hours on screen plus the one in progress)"
        type: string
        default: "6"
      encoder:
        description: "auto (the xuepy wheel when its release knows the goeswest source, else the reference pipeline), native (insist on the wheel) or python (insist on the reference pipeline)"
        type: choice
        options: [auto, native, python]
        default: auto
      profile:
        description: "Quantization/compression profile"
        type: choice
        options: [balanced, quality, compact]
        default: balanced
      keep:
        description: "Published runs to keep on R2 (2 = the live run and the one before it)"
        type: string
        default: "2"
      force:
        description: "Build a round even when the live one already ends at the bucket's newest frame"
        type: boolean
        default: false
      dry_run:
        description: "Build and report what the uploads and prunes would do, but write nothing to R2"
        type: boolean
        default: false

permissions:
  contents: read
  # scripts/successor_queued.sh lists this workflow's waiting runs, for a
  # looping dispatch to yield to the next scheduled job. rounds.yml can only
  # narrow what it is granted here.
  actions: read

concurrency:
  # A dry run writes nothing to R2, so it takes a group of its own and
  # never queues the live job or is queued behind it.
  group: ${{ inputs.dry_run && format('publish-goeswest-dry-{0}', github.run_id) || 'publish-goeswest' }}
  # A late cron queues behind the job still running and then finds
  # nothing new; a looping dispatch yields to it on its own.
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs on forks would publish into a bucket they cannot reach.
    if: github.event_name != 'schedule' || github.repository == 'ringsaturn/xue'
    uses: ./.github/workflows/rounds.yml
    with:
      model: goeswest
      hours: ${{ inputs.hours || '6' }}
      round_minutes: ${{ inputs.round_minutes || '5' }}
      loop: ${{ inputs.loop || false }}
      encoder: ${{ inputs.encoder || 'auto' }}
      profile: ${{ inputs.profile || 'balanced' }}
      keep: ${{ inputs.keep || '2' }}
      force: ${{ inputs.force || false }}
      dry_run: ${{ inputs.dry_run || false }}
      uv_group: satellite
      gdal: always
      frame_cache: true
      frames_keep_hours: "8"
      ancillary: true
    secrets: inherit
