name: release-wheels-csv

# Records the xuepy wheels attached to the GitHub releases in
# .github/release_wheels.csv, commits it to main, and asks docs-rust.yml to
# redeploy the GitHub Pages site, which renders the own xuepy index from that
# file (docs/contribution/releasing.md, "The own index").
#
# The CSV is the incremental record: a run asks the API only for releases newer
# than the newest one it holds, and the Pages build reads the file alone.
#
# Triggers: release-crate.yml creates the release with the workflow token, and
# events a workflow token causes start no workflows, so `release: published`
# alone would never fire for a tagged release. release-xuepy.yml finishing is
# what follows the wheels landing on the release; `release: published` covers a
# release made by hand, and a dispatch rebuilds on demand.
#
# Only assets uploaded by github-actions[bot] are indexed: a wheel attached by
# hand to a release does not reach the index without passing the smoke test.

on:
  workflow_run:
    workflows: [release-xuepy]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    # A fork has neither the releases nor the Pages site, and a dispatch of
    # release-xuepy.yml (workflow artifacts only) attaches nothing.
    if: >-
      github.repository == 'ringsaturn/xue' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit the CSV to main
      actions: write # dispatch docs-rust.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Tag dates order the index; the script reads them from git.
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the release assets into the CSV
        run: |
          set -euo pipefail
          python3 scripts/build_simple_index.py \
            --repository "${GITHUB_REPOSITORY}" \
            --package xuepy \
            --min-tag v0.3.0 \
            --uploader-login 'github-actions[bot]' \
            --csv .github/release_wheels.csv \
            --output "${RUNNER_TEMP}/site"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A commit made with the workflow token starts no push workflow, so the
      # Pages deploy is dispatched explicitly.
      - name: Commit the CSV and redeploy Pages
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/release_wheels.csv; then
            echo "no new wheels"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release_wheels.csv
          git commit -m "chore: record the xuepy release wheels"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run docs-rust.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
