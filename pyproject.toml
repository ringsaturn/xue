[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuebuild"
version = "0.1.0"
description = "Xue (雪) build pipeline: fetch weather runs and pack them into browser-ready spatiotemporal bundles"
# Not a library. This is how this project builds its own site, it is installed
# from a checkout, and the classifier makes PyPI refuse it outright so it
# cannot be uploaded by accident. The Rust binding is what publishes, as xuepy.
classifiers = ["Private :: Do Not Upload"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
    "numpy>=2.0",
    # The native encoder (rust/xue-py); XUE_ENCODER=python falls back to the
    # reference pipeline. The floor tracks the current release because the
    # wheel's source table must match xuebuild/sources.py, and a wheel that
    # publishes a different bundle set refuses to build (docs/contribution/releasing.md).
    "xuepy>=0.30,<0.31",
]

[project.scripts]
# The command keeps its name; only the module behind it moved.
xue = "xuebuild.cli:main"

[tool.setuptools.packages.find]
include = ["xuebuild*"]

[tool.setuptools.package-data]
xuebuild = ["palette.txt", "precipitation_palette.txt", "stacindex.html"]

[dependency-groups]
# Tests, and reading a delta-coded store or the STAC catalog the way a client would.
zarr = ["zarr>=3.1", "numcodecs>=0.16", "xarray>=2025.1", "pystac>=1.14"]
# The CMA radar fetch: reads its daily Zarr archive over s3fs (xuebuild/cmaarchive.py).
cma = ["zarr>=3.1", "numcodecs>=0.16", "s3fs>=2024.10", "xarray>=2025.1", "netcdf4>=1.7"]
# The SWPC aurora fetch: writes its frame cache and window series as NetCDF (xuebuild/aurora.py).
aurora = ["xarray>=2025.1", "netcdf4>=1.7"]
# The satellite fetch: Dust RGB / DEBRA producers (shachen) and the FCI JPEG-LS filter.
satellite = ["shachen>=0.3.0", "xarray>=2025.1", "hdf5plugin>=5.0"]
