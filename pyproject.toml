[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuebuild"
version = "0.1.0"
description = "Xue (雪) build pipeline: fetch weather runs and pack them into browser-ready spatiotemporal bundles"
# Not a library. This is how this project builds its own site, it is installed
# from a checkout, and the classifier makes PyPI refuse it outright so it
# cannot be uploaded by accident. The Rust binding is what publishes, as xuepy.
classifiers = ["Private :: Do Not Upload"]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = [
    "numpy>=2.0",
    # The native encoder, built from rust/xue-py in this repository. A build
    # runs through it by default; XUE_ENCODER=python falls back to the
    # subprocess pipeline, which is the reference implementation.
    #
    # 0.4 is the floor because `xue.gdal_info` arrived there, and
    # `xuebuild.gdal.dataset_info` uses it to inspect inputs through the
    # wheel's own GDAL. Below it a build still works but needs a system
    # `gdalinfo` on PATH, which the scheduled publish workflows no longer
    # install. The floor tracks the current release because the wheel's
    # source table must match sources.py (a wheel that publishes a different
    # bundle set refuses to build), and 0.16 is the first wheel that knows
    # the JMA precipitation nowcast: a fetched observation arriving as one
    # NetCDF series per window, its five-minute times snapped to a 300 s
    # axis and the window's first hour taken as the run.
    "xuepy>=0.16,<0.17",
]

[project.scripts]
# The command keeps its name; only the module behind it moved.
xue = "xuebuild.cli:main"

[tool.setuptools.packages.find]
include = ["xuebuild*"]

[tool.setuptools.package-data]
xuebuild = ["palette.txt", "precipitation_palette.txt"]

[dependency-groups]
# Optional, for tests and for reading a delta-coded store through
# zarr-python / xarray. The exporter itself (xuebuild/zarrstore.py) writes a
# Zarr v3 store with NumPy alone, so the runtime dependencies above stay
# NumPy + xuepy; this group only registers the `xue.delta` codec
# (xuebuild/zarrcodec.py) and opens the result the way any Zarr client
# would — pystac likewise reads the STAC catalog (xuebuild/stac.py, also
# hand-written) the way a catalog client would, in tests/test_stac.py.
zarr = ["zarr>=3.1", "numcodecs>=0.16", "xarray>=2025.1", "pystac>=1.14"]
