[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xuepy"
version = "0.1.0"
description = "Xue (雪) encoder: pack global weather forecasts into browser-ready spatiotemporal bundles"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["numpy>=2.0"]

[project.scripts]
xue = "xue.cli:main"

[tool.setuptools.packages.find]
include = ["xue*"]

[tool.setuptools.package-data]
xue = ["palette.txt", "precipitation_palette.txt"]
