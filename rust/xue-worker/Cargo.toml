[package]
name = "xue-worker"
version = "0.1.0"
edition = "2021"
description = "The Xue data API as a Cloudflare Worker"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xue = { path = "../xue" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
futures-util = "0.3"
