[package]
name = "xue-worker"
version = "0.1.0"
edition = "2021"
description = "The Xue data API as a Cloudflare Worker"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xue = { path = "../xue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"

# The Workers runtime builds only for wasm32. Everything above it — the
# resolution chain, the point read, the source summary — compiles natively
# too, which is what lets `cargo test -p xue-worker` run them over the web
# fixtures without wrangler.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
js-sys = "0.3"

[dev-dependencies]
futures-executor = "0.3"
