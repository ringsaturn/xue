[package]
name = "xue-worker"
version = "0.1.0"
edition = "2021"
description = "The Xue data API as a Cloudflare Worker"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The native HTTP server (`xue-api-server`): the same routes, read from the
# public origin, for a self-hosted origin behind a Cloudflare Tunnel.
server = ["dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:reqwest", "dep:flate2"]

[[bin]]
name = "xue-api-server"
required-features = ["server"]

[dependencies]
xue = { path = "../xue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
url = "2"
percent-encoding = "2"
# The point's IANA zone. `bundled` embeds tzf-dist's lite polygon file
# (~4 MB raw, 2.6 MB gzipped) in the wasm; `EmbeddedFinder` queries it in
# place, so a cold isolate pays no decode and the lookup is microseconds.
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }

# The Workers runtime builds only for wasm32. Everything above it — the
# resolution chain, the point read, the source summary — compiles natively
# too, which is what lets `cargo test -p xue-worker` run them over the web
# fixtures without wrangler.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "signal", "macros"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
flate2 = { version = "1", optional = true }

[dev-dependencies]
futures-executor = "0.3"
