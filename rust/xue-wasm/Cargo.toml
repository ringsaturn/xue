[package]
name = "xue-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen browser bindings for the Xue decoder"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xue = { path = "../xue" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
